name: CI - Engineering Protocol
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: الخطوة الحتمية 1 - استنساخ المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: الخطوة الحتمية 2 - إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.10.0'

      - name: الخطوة الحتمية 3 - تثبيت pnpm (حل جذري يلغي الأخطاء الخارجية)
        run: npm install -g pnpm@9.15.0

      - name: الخطوة الحتمية 4 - تثبيت الاعتماديات
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "✅ pnpm-lock.yaml موجود، تثبيت بحماية القفل..."
            pnpm install --frozen-lockfile
          else
            echo "⚠️ pnpm-lock.yaml غير موجود، توليد قفل جديد..."
            pnpm install
          fi

      - name: الخطوة الحتمية 5 - الفحص الداخلي والبناء
        run: |
          echo "Running validation protocol..."
          pnpm lint && pnpm build:ci

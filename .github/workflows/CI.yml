name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-dependencies
        with:
          node-version: '20.x'

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check
name: CI - Engineering Protocol
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: الخطوة 1 - استنساخ المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: الخطوة 2 - إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.10.0'

      - name: الخطوة 3 - تثبيت pnpm
        run: npm install -g pnpm@9.15.0

      - name: الخطوة 4 - تثبيت الاعتماديات
        run: pnpm install --no-frozen-lockfile

      - name: الخطوة 5 - البناء
        run: pnpm build
name: CI - Engineering Protocol
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: الخطوة الحتمية 1 - استنساخ المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: الخطوة الحتمية 2 - إعداد بيئة pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0 # التصحيح الجذري: مطابق لـ packageManager في package.json
          run_install: false

      - name: الخطوة الحتمية 3 - إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.10.0'
          cache: 'pnpm'

      - name: الخطوة الحتمية 4 - تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile

      - name: الخطوة الحتمية 5 - الفحص الداخلي والبناء
        run: |
          echo "Running validation protocol..."
          pnpm lint && pnpm build:ci
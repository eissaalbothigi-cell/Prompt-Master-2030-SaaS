name: Generate pnpm-lock.yaml

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'الفرع المستهدف (افتراضي: main)'
        required: true
        default: 'main'

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Generate pnpm-lock.yaml
        run: pnpm install --lockfile-only

      - name: Check if lockfile changed
        id: check_changes
        run: |
          if git diff --quiet HEAD -- pnpm-lock.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with lockfile
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: regenerate pnpm-lock.yaml'
          title: 'chore: regenerate pnpm-lock.yaml'
          body: |
            تم توليد ملف `pnpm-lock.yaml` تلقائياً عبر GitHub Actions.
            
            - المشروع يستخدم `packageManager: pnpm@9.0.0`
            - تم تشغيل `pnpm install --lockfile-only`
            - يُرجى مراجعة الملف والموافقة على الدمج
          branch: actions/generate-pnpm-lock
          base: ${{ github.event.inputs.branch }}
          delete-branch: true
          

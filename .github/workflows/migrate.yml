name: Database Migration (Disabled)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    # ✅ تم تعطيله مؤقتاً لأن الجداول موجودة يدوياً في Neon
    # 🔄 لتفعيله مستقبلاً، غيّر 'false' إلى 'true'
    if: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run database migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Migration completed
        run: echo "✅ Database migration completed successfully"